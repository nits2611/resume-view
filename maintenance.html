<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Maintenance | Nitesh Harjilawala</title>
  <meta name="robots" content="noindex, nofollow" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #001b66, #0f766e);
      color: #ffffff;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .maintenance-card {
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(14px);
    }

    .maintenance-logo {
      width: 86px;
      height: 86px;
      border-radius: 22px;
      margin-bottom: 20px;
      object-fit: cover;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.1;
      font-weight: 800;
    }

    p {
      margin: 0 auto;
      max-width: 440px;
      color: #dbeafe;
      font-size: 16px;
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      margin-top: 24px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
  </style>
</head>

<body>
  <main class="maintenance-card">
    <img
      src="assets/icons/nh-logo-512p.webp"
      alt="NH logo"
      class="maintenance-logo"
    >

    <h1>Under The Maintenance</h1>

    <p>
      I am updating this portfolio to improve the experience, content, and performance.
      Please check back shortly.
    </p>

    <div class="status">Actively maintained by Nitesh Harjilawala</div>
  </main>
</body>
</html>
